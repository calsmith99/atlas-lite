<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body data-state="idle">
<div id="globe"></div>
<div id="vignette"></div>

<header id="title">
  <span class="flourish">❧</span>
  <h1>Atlas</h1>
  <span class="flourish flip">❧</span>
  <div id="subtitle"><span id="clock"></span> · <span id="notecount"></span></div>
</header>

<button id="flip" title="Flip the globe to the next graph" aria-label="Flip the globe"><span class="flip-glyph">&#10226;</span> <span id="flip-name">Notes</span></button>

<div id="left">
  <section id="transcript" class="panel">
    <div class="panel-head">
      <h2 id="session-title">The Conversation</h2>
      <span id="driver-note" class="muted" hidden></span>
    </div>
    <div id="session-cwd"></div>
    <div id="entries"></div>
    <form id="composer" autocomplete="off">
      <textarea id="draft" rows="2" placeholder="Start a session below, or pick one" disabled></textarea>
      <button id="send" type="submit" disabled>Send</button>
      <button id="mic" type="button" hidden title="Voice">&#127908;</button>
    </form>
    <div id="composer-error" hidden></div>
  </section>

  <section id="selector" class="panel">
    <div id="sessions"></div>
    <div id="popover" hidden>
      <form id="new-form">
        <label>Start a session in <input id="new-cwd" spellcheck="false"></label>
        <button type="submit">Begin</button>
      </form>
      <div id="older-list"></div>
    </div>
  </section>
</div>

<div id="addons"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gold-dome" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#d9ac4a"/><stop offset="1" stop-color="#5e4116"/></radialGradient>
    <radialGradient id="bronze-dome" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#e7b583"/><stop offset=".4" stop-color="#9a6233"/><stop offset="1" stop-color="#3a2414"/></radialGradient>
    <radialGradient id="stone-dome" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#6d655a"/><stop offset="1" stop-color="#2a2520"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#8a6424"/><stop offset=".2" stop-color="#f2d68e"/><stop offset=".4" stop-color="#c9a45c"/><stop offset=".6" stop-color="#7a5a24"/><stop offset=".8" stop-color="#e8c87a"/><stop offset="1" stop-color="#a8823c"/></linearGradient>
  </defs>
</svg>

<div id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
